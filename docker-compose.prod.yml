services:
  # ==========================================
  # Storage & Middleware Layer
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: mini_im_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mini_im_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_im_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: mini_im_pgbouncer
    restart: always
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mini_im_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 50
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    container_name: mini_im_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:latest
    container_name: mini_im_kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 4
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: mini_im_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ==========================================
  # Frontend SPA Container (React + Vite + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini_im_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api_server
      - ws_gateway_1
      - ws_gateway_2

  # ==========================================
  # Backend Microservices Cluster
  # ==========================================
  api_server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_im_api_1
    restart: always
    command: ["python", "run_api.py"]
    environment:
      SERVICE_ROLE: "api"
      PORT: "5001"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_URL: "http://127.0.0.1:9000"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      minio:
        condition: service_started

  ws_gateway_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_im_ws_gw_1
    restart: always
    command: ["python", "run_gateway.py"]
    environment:
      SERVICE_ROLE: "gateway"
      NODE_ID: "gateway_node_1"
      PORT: "5002"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_URL: "http://127.0.0.1:9000"
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      minio:
        condition: service_started

  ws_gateway_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_im_ws_gw_2
    restart: always
    command: ["python", "run_gateway.py"]
    environment:
      SERVICE_ROLE: "gateway"
      NODE_ID: "gateway_node_2"
      PORT: "5003"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_URL: "http://127.0.0.1:9000"
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      minio:
        condition: service_started

  kafka_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_im_kafka_worker
    restart: always
    command: ["python", "run_worker.py"]
    environment:
      SERVICE_ROLE: "worker"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KAFKA_CONSUMER_GROUP: "mini_im_cluster_worker_group"
      KAFKA_BATCH_SIZE: 200
      KAFKA_BATCH_TIMEOUT_MS: 50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  # ==========================================
  # L7 Load Balancer & Gateway (Nginx)
  # ==========================================
  nginx_lb:
    image: nginx:alpine
    container_name: mini_im_nginx_lb
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api_server
      - ws_gateway_1
      - ws_gateway_2

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
