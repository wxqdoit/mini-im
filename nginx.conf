# Mini IM 100k Concurrent Production Nginx Configuration
worker_processes auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    keepalive_requests 10000;

    # Gzip compression for high concurrency static delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream Frontend Cluster (React SPA)
    upstream frontend_cluster {
        server frontend:80;
        keepalive 128;
    }

    # Upstream WebSocket Gateway Cluster (Consistent Token Hashing for 100k connections)
    upstream ws_gateway_cluster {
        hash $arg_token consistent;
        server ws_gateway_1:5002 max_fails=3 fail_timeout=10s;
        server ws_gateway_2:5003 max_fails=3 fail_timeout=10s;
        keepalive 1024;
    }

    # Upstream REST API Cluster (Least Connections)
    upstream api_cluster {
        least_conn;
        server api_server:5001;
        keepalive 512;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 30M;

        # WebSocket Reverse Proxy
        location /ws {
            proxy_pass http://ws_gateway_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_connect_timeout 10s;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
            proxy_buffering off;
        }

        # REST API Endpoints
        location /api/ {
            proxy_pass http://api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # MinIO Media Storage
        location /mini-im-media/ {
            proxy_pass http://minio:9000/mini-im-media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Static Frontend (Reverse Proxy to Frontend Container)
        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
